name: Unzip upload
on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          Z=$(ls *.zip 2>/dev/null | head -n 1)
          [ -z "$Z" ] && exit 0
          unzip -q -o "$Z" -d /tmp/x
          rsync -a --delete --exclude=.git --exclude=.github /tmp/x/sfl_guro/ ./
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Update from $Z" || exit 0
          git push
